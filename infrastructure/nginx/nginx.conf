events {}
http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  server_tokens off;

  upstream app_01_frontend { server app-01-frontend:4173; }
  upstream app_02_frontend { server app-02-frontend:4173; }
  upstream app_03_frontend { server app-03-frontend:4173; }
  upstream app_04_frontend { server app-04-frontend:4173; }
  upstream app_05_frontend { server app-05-frontend:4173; }
  upstream app_06_frontend { server app-06-frontend:4173; }
  upstream app_07_frontend { server app-07-frontend:4173; }
  upstream app_08_frontend { server app-08-frontend:4173; }
  upstream app_09_frontend { server app-09-frontend:4173; }
  upstream app_10_frontend { server app-10-frontend:4173; }

  server {
    listen 80;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /app-01/ { proxy_pass http://app_01_frontend/; }
    location /app-02/ { proxy_pass http://app_02_frontend/; }
    location /app-03/ { proxy_pass http://app_03_frontend/; }
    location /app-04/ { proxy_pass http://app_04_frontend/; }
    location /app-05/ { proxy_pass http://app_05_frontend/; }
    location /app-06/ { proxy_pass http://app_06_frontend/; }
    location /app-07/ { proxy_pass http://app_07_frontend/; }
    location /app-08/ { proxy_pass http://app_08_frontend/; }
    location /app-09/ { proxy_pass http://app_09_frontend/; }
    location /app-10/ { proxy_pass http://app_10_frontend/; }

    location /api/app-01/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-01-backend:3000/; }
    location /api/app-02/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-02-backend:3000/; }
    location /api/app-03/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-03-backend:3000/; }
    location /api/app-04/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-04-backend:3000/; }
    location /api/app-05/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-05-backend:3000/; }
    location /api/app-06/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-06-backend:3000/; }
    location /api/app-07/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-07-backend:3000/; }
    location /api/app-08/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-08-backend:3000/; }
    location /api/app-09/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-09-backend:3000/; }
    location /api/app-10/ { limit_req zone=api_limit burst=60 nodelay; proxy_pass http://app-10-backend:3000/; }
  }
}
