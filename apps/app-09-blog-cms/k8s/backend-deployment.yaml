apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-09-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-09-backend
  template:
    metadata:
      labels:
        app: app-09-backend
    spec:
      containers:
        - name: backend
          image: app-09-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-09-config
            - secretRef:
                name: app-09-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
